[package]
name = "marka"
version = "0.1.0"
description = "A local-first Markdown and safe MDX editor"
authors = ["Marka contributors"]
edition = "2021"

[lib]
name = "marka_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
walkdir = "2"
regex = "1"
uuid = { version = "1", features = ["v4"] }
