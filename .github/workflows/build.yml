name: Build Marka desktop packages

on:
  pull_request:
  push:
    branches: ["**"]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux x64
            os: ubuntu-22.04
            args: --bundles deb,appimage
          - platform: Windows x64
            os: windows-latest
            args: --bundles nsis
          - platform: macOS universal
            os: macos-latest
            args: --target universal-apple-darwin --bundles app,dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux native prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils
      - name: Install both macOS architectures
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Verify frontend behavior and exports
        run: npm test
      - name: Verify native filesystem behavior
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml -- --nocapture
      - name: Build native packages
        uses: tauri-apps/tauri-action@v1
        with:
          args: ${{ matrix.args }}
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: "Marka-[platform]-[arch]-[bundle]"
      - name: Verify universal application slices
        if: runner.os == 'macOS'
        shell: bash
        run: |
          binary=src-tauri/target/universal-apple-darwin/release/bundle/macos/Marka.app/Contents/MacOS/marka
          lipo -archs "$binary"
          lipo -verify_arch x86_64 arm64 "$binary"
      - name: Archive macOS application with executable permissions
        if: runner.os == 'macOS'
        run: tar -czf src-tauri/target/universal-apple-darwin/release/bundle/Marka_universal.app.tar.gz -C src-tauri/target/universal-apple-darwin/release/bundle/macos Marka.app
      - name: Inspect Debian package metadata
        if: runner.os == 'Linux'
        shell: bash
        run: |
          for package in src-tauri/target/release/bundle/deb/*.deb; do
            dpkg-deb --info "$package"
            dpkg-deb --contents "$package"
          done
      - name: Stage release installers
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ runner.os }}
          if-no-files-found: error
          compression-level: 0
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/*.app.tar.gz
